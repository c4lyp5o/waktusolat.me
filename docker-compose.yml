# waktusolat.me — local / single-host compose.
#
# Production runs behind Traefik from its own compose file on the server
# (see README → "Production behind Traefik"); keep the two in sync.
#
# PERSISTENT STATE (both gitignored, both survive rebuilds):
#   ./storage     -> /app/storage      sqlite visitor DB (DB_PATH)
#   ./data/times  -> /app/data/times   prayer times fetched from JAKIM
# Do NOT bind ./db or ./data — they hold code (db/db.js, data/getter.js)
# and tracked quran/hadith JSON that a bind mount would shadow.
#
# Secrets come from .env next to this file (see .env.example).
services:
  app:
    build: .
    # image: calypso666/waktusolat.me:latest   # or run the published image
    container_name: waktusolat
    restart: unless-stopped
    ports:
      # Local access only. Behind a reverse proxy, drop this and let the proxy
      # reach the container over the docker network: a port published to the
      # internet bypasses the proxy (client IPs then come from the socket).
      - "127.0.0.1:5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - TZ=Asia/Kuala_Lumpur
      - DB_PATH=/app/storage/visitors.sqlite
      # Admin routes (GET /visitors, POST /cache/invalidate) need
      # `x-api-key: $ADMIN_API_KEY`. Unset/empty = admin routes always 401.
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
    volumes:
      - ./storage:/app/storage
      - ./data/times:/app/data/times
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
