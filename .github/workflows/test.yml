# ez standard test workflow: lint, tests and build, plus the Docker image
# built, booted and healthy. Runs on PRs. This repo publishes by pushing to
# staging/main (docker-publish-*.yml), not through a publish.yml, so the test
# job is also callable (workflow_call) if the publishes ever want to gate on it.
name: test

on:
  pull_request:
    branches: [development, staging, main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, tests & build
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v7
      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: 📦 Install dependencies
        run: |
          bun install --frozen-lockfile
          cd client && bun install --frozen-lockfile
      - name: 🧹 Lint (Biome)
        run: bun run lint
      - name: 🧪 Tests
        run: bun run test
      - name: 🏗️ Build client
        run: bun run build-client

  docker:
    name: Docker image (build, boot, healthy)
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v7
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: 🛠️ Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: waktusolat:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: 🔬 Boot and wait for healthy
        run: |
          set -euo pipefail
          docker run -d --name app waktusolat:ci
          status=starting
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Running}}' app)" = true ] || { echo "::error::container exited"; docker logs app; exit 1; }
            status=$(docker inspect -f '{{.State.Health.Status}}' app)
            [ "$status" = healthy ] && break
            sleep 2
          done
          test "$status" = healthy
      - name: 🔌 Healthcheck answers
        run: |
          docker exec app bun -e 'const r = await fetch("http://127.0.0.1:5000/api/v1/healthcheck"); const j = await r.json(); if (!j.ok) { console.error(j); process.exit(1); } console.log("healthcheck ok", r.status);'
      - name: 🧾 Container logs
        if: always()
        run: docker logs app || true
