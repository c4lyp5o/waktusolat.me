<!doctype html>
<html lang="ms"><head><meta charset="utf-8">
<title>TV 10 — Senyap</title>
<link rel="stylesheet" href="tv-base.css">
<style>
:root{--bg:#0a0a0b;--ink:#e9e7e2;--dim:#7d7c78;--faint:#4e4e4b;--amber:#d8a964}
.stage{background:var(--bg)}
.tv10{width:100%;height:100%;display:flex;flex-direction:column;color:var(--ink);
  font-family:"Bricolage",sans-serif;padding:66px 90px 60px}
.tv10 header{display:flex;justify-content:space-between;align-items:baseline;
  font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.tv10 header .m{font-family:"ReemKufi",sans-serif;font-size:34px;letter-spacing:.04em;text-transform:none;color:var(--ink)}
.tv10 header .m span{font-family:"Bricolage",sans-serif;font-size:17px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--faint);margin-left:20px}
.tv10 header b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}

.tv10 .mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.tv10 .k{font-size:26px;letter-spacing:.4em;text-transform:uppercase;color:var(--dim)}
.tv10 .cd{font-size:520px;font-weight:200;letter-spacing:-.08em;line-height:.78;
  font-variant-numeric:tabular-nums;margin-top:18px;margin-left:-24px}
.tv10 .meta{display:flex;align-items:baseline;gap:34px;margin-top:14px}
.tv10 .meta .p{font-size:46px;letter-spacing:.06em}
.tv10 .meta .j{font-size:30px;color:var(--amber);opacity:.85}
.tv10 .meta .t{font-size:26px;color:var(--dim);letter-spacing:.04em}
.tv10 .meta .t b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}

.tv10 .strip{display:flex;justify-content:space-between;align-items:baseline;
  border-top:1px solid rgba(255,255,255,.10);padding-top:24px}
.tv10 .strip div{text-align:center}
.tv10 .strip .n{font-size:17px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.tv10 .strip .t{font-size:70px;font-weight:200;font-variant-numeric:tabular-nums;letter-spacing:-.03em;
  margin-top:4px;color:var(--dim)}
.tv10 .strip .next .n{color:var(--amber)}
.tv10 .strip .next .t{color:var(--amber);font-weight:300}
.tv10 .strip .past .t{color:#3f3f3d}
.tv10 .strip .past .n{color:#333331}
.tv10 footer{display:flex;justify-content:space-between;font-size:15px;letter-spacing:.16em;
  text-transform:uppercase;color:#3d3d3b;margin-top:22px}
</style></head>
<body>
<div class="stage" data-w="1920" data-h="1080">
 <div class="tv10">
  <header>
    <span class="m">Masjid Al-Ikhlas<span>Seksyen 19 · Shah Alam</span></span>
    <span>Isnin 23 Nov 2026 · 13 Jamadilakhir 1448 · <b>16:52:41</b></span>
  </header>

  <section class="mid">
    <div class="k">Maghrib dalam</div>
    <div class="cd num">2:08</div>
    <div class="meta"><span class="p">Maghrib</span><span class="jawi">مغرب</span><span class="t">azan <b>19:00</b> · iqamah <b>19:10</b></span></div>
  </section>

  <div class="strip">
    <div class="past"><div class="n">Imsak</div><div class="t">05:40</div></div>
    <div class="past"><div class="n">Subuh</div><div class="t">05:50</div></div>
    <div class="past"><div class="n">Syuruk</div><div class="t">06:59</div></div>
    <div class="past"><div class="n">Zohor</div><div class="t">13:02</div></div>
    <div class="past"><div class="n">Asar</div><div class="t">16:25</div></div>
    <div class="next"><div class="n">Maghrib</div><div class="t">19:00</div></div>
    <div><div class="n">Isyak</div><div class="t">20:13</div></div>
  </div>

  <footer><span>JAKIM · Waktu Malaysia</span><span>SGR01</span></footer>
 </div>
</div>
<script src="tv.js"></script>
</body></html>
